<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2b2d42" />
    <title>G Chess</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>G Chess</h1>
        <div class="top-btns">
          <button class="icon-btn ui" id="learn-btn" aria-label="Learn to play">🎓</button>
          <button class="icon-btn ui" id="leaderboard-btn" aria-label="Leaderboard">🏆</button>
          <button class="icon-btn ui" id="settings-btn" aria-label="Settings">⚙︎</button>
        </div>
      </header>

      <p class="status ui" id="status" role="status" aria-live="polite">Your turn!</p>

      <div class="tray" id="tray-top" aria-label="Pieces captured"></div>
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Chess board"></div>
      </div>
      <div class="tray" id="tray-bottom" aria-label="Pieces captured"></div>

      <nav class="controls">
        <button class="btn ui" id="undo-btn">↶ Undo</button>
        <button class="btn ui" id="hint-btn">💡 Hint</button>
        <button class="btn ui primary" id="new-btn">New game</button>
      </nav>
    </main>

    <dialog id="settings" class="sheet">
      <form method="dialog">
        <h2>New game</h2>
        <button type="button" class="btn ui learn-link" id="learn-from-settings">🎓 New to chess? Learn to play</button>
        <fieldset>
          <legend>Play against</legend>
          <label><input type="radio" name="mode" value="computer" checked /> The computer</label>
          <label><input type="radio" name="mode" value="friend" /> A friend</label>
        </fieldset>
        <fieldset id="me-set">
          <legend>Who are you?</legend>
          <label>Me <select name="me" class="player-pick"></select></label>
        </fieldset>
        <fieldset id="friends-set">
          <legend>Who's playing?</legend>
          <label>White <select name="white" class="player-pick"></select></label>
          <label>Black <select name="black" class="player-pick"></select></label>
        </fieldset>
        <fieldset id="level-set">
          <legend>Computer level</legend>
          <label><input type="radio" name="level" value="easy" checked /> Easy</label>
          <label><input type="radio" name="level" value="medium" /> Medium</label>
          <label><input type="radio" name="level" value="hard" /> Hard</label>
        </fieldset>
        <fieldset id="color-set">
          <legend>I play</legend>
          <label><input type="radio" name="color" value="w" checked /> White (go first)</label>
          <label><input type="radio" name="color" value="b" /> Black</label>
        </fieldset>
        <fieldset>
          <legend>Board</legend>
          <label><input type="checkbox" name="labels" checked /> Show square names</label>
        </fieldset>
        <div class="sheet-actions">
          <button class="btn ui" value="cancel">Cancel</button>
          <button class="btn ui primary" value="start">Start</button>
        </div>
      </form>
    </dialog>

    <dialog id="leaderboard" class="sheet">
      <form method="dialog">
        <h2>🏆 Leaderboard</h2>
        <p class="lb-empty" id="lb-empty">No games yet. Finish a game to get on the board!</p>
        <ol class="lb-list" id="lb-list"></ol>
        <h3 class="lb-heading" id="lb-pairs-title">Friend vs friend</h3>
        <ul class="lb-pairs" id="lb-pairs"></ul>
        <div class="sheet-actions one">
          <button class="btn ui primary" value="close">Done</button>
        </div>
      </form>
    </dialog>

    <dialog id="learn" class="sheet learn">
      <div id="learn-menu">
        <h2>🎓 Learn to play</h2>
        <div class="learn-stats">
          <span id="learn-streak"></span>
          <span id="learn-stars"></span>
        </div>
        <div class="lesson-path" id="lesson-path"></div>
        <div class="sheet-actions one">
          <button type="button" class="btn ui primary" id="learn-close">Done</button>
        </div>
      </div>
      <div id="learn-lesson" hidden>
        <h2 id="lesson-title"></h2>
        <div class="lesson-progress" aria-hidden="true"><span id="lesson-bar"></span></div>
        <p class="lesson-step" id="lesson-step"></p>
        <p class="lesson-text" id="lesson-text"></p>
        <div class="board learn-board" id="learn-board" role="grid" aria-label="Lesson board"></div>
        <p class="lesson-feedback" id="lesson-feedback" role="status" aria-live="polite"></p>
        <div class="lesson-actions">
          <button type="button" class="btn ui" id="lesson-back">◀ Lessons</button>
          <button type="button" class="btn ui" id="lesson-retry">↺ Again</button>
          <button type="button" class="btn ui primary" id="lesson-next" disabled>Next ▶</button>
        </div>
      </div>
      <div id="learn-result" class="learn-result" hidden>
        <h2 id="result-title"></h2>
        <p class="result-stars" id="result-stars"></p>
        <p class="result-text" id="result-text"></p>
        <p class="result-streak" id="result-streak"></p>
        <div class="sheet-actions">
          <button type="button" class="btn ui" id="result-path">Path</button>
          <button type="button" class="btn ui primary" id="result-next"></button>
        </div>
      </div>
    </dialog>

    <dialog id="promotion" class="sheet">
      <form method="dialog">
        <h2>Your pawn made it! Pick a new piece:</h2>
        <div class="promo-choices" id="promo-choices"></div>
      </form>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
